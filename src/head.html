<title>Trade Winds Career</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a charter dispatch desk. Sticky status band, tab rail, and job cards drawn as ATC flight strips. */
:root{
  --bg:#e7f1f0;
  --surface:#ffffff;
  --surface-2:#f2f8f7;
  --ink:#0f2429;
  --muted:#53696d;
  --line:#c9dbda;
  --sea:#0b746f;
  --sea-soft:#d3ebe8;
  --coral:#d9532f;
  --coral-soft:#fbe3da;
  --sand:#f3e6c9;
  --sky:#2a68aa;
  --sky-soft:#dde9f6;
  --good:#1d7f47;
  --warn:#9c6410;
  --bad:#b8352a;
  --strip-pax:#f6eedc;
  --strip-cargo:#e3edf7;
  --strip-vip:#f9e4dc;
  --strip-story:#d9efe9;
  --strip-check:#ece4f6;
  --violet:#6a49a8;
  --shadow:0 1px 2px rgba(15,36,41,.08),0 4px 14px rgba(15,36,41,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08171a;--surface:#0f2327;--surface-2:#0b1d20;--ink:#e2eeed;--muted:#93aaa9;--line:#22393c;
  --sea:#43b8ad;--sea-soft:#123430;--coral:#ff7a55;--coral-soft:#3a1f17;--sand:#2c2819;--sky:#72aee9;--sky-soft:#13283b;
  --good:#52c585;--warn:#e3aa4f;--bad:#ff6b5b;--strip-pax:#1f2219;--strip-cargo:#14222e;--strip-vip:#2a1b17;--strip-story:#10292a;--strip-check:#1e1a2a;--violet:#b39af0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08171a;--surface:#0f2327;--surface-2:#0b1d20;--ink:#e2eeed;--muted:#93aaa9;--line:#22393c;
  --sea:#43b8ad;--sea-soft:#123430;--coral:#ff7a55;--coral-soft:#3a1f17;--sand:#2c2819;--sky:#72aee9;--sky-soft:#13283b;
  --good:#52c585;--warn:#e3aa4f;--bad:#ff6b5b;--strip-pax:#1f2219;--strip-cargo:#14222e;--strip-vip:#2a1b17;--strip-story:#10292a;--strip-check:#1e1a2a;--violet:#b39af0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--sea)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Status band */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#eaf3f2}
:root[data-theme="dark"] .band{background:#030c0e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{background:#030c0e}}
.band-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.65}
.stat .v{font-family:var(--f-mono);font-size:14px;font-weight:500;white-space:nowrap}
.sync{font-size:11px;opacity:.7;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.1)}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;color:#c6d6d5;padding:9px 12px 10px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:#fff}
.tab[aria-current="page"]{color:#fff;border-bottom-color:var(--coral)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--coral);margin-left:6px;vertical-align:2px}

main{padding-block:22px 64px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:900px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:20px}
.panel h3{font-size:16px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.section-title h2{font-size:22px}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#04201d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#04201d}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.action{background:var(--coral);border-color:var(--coral);color:#fff}
:root[data-theme="dark"] .btn.action{color:#2a0d05}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.action{color:#2a0d05}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.chip.new{background:var(--coral-soft);color:var(--coral);border-color:transparent}
.chip.sea{background:var(--sea-soft);color:var(--sea);border-color:transparent}
.chip.sky{background:var(--sky-soft);color:var(--sky);border-color:transparent}
.chip.vio{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 35%,var(--line))}

/* Flight strips */
.strips{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-template-columns:118px minmax(0,1.5fr) minmax(0,1fr) 128px;border:1px solid var(--line);border-radius:3px;background:var(--strip-pax);box-shadow:var(--shadow);overflow:hidden}
.strip.cargo{background:var(--strip-cargo)}
.strip.vip{background:var(--strip-vip)}
.strip.story{background:var(--strip-story)}
.strip.check{background:var(--strip-check)}
.strip.locked{opacity:.62}
.strip > div{padding:10px 12px;border-right:1px dashed color-mix(in srgb,var(--ink) 22%,transparent);min-width:0}
.strip > div:last-child{border-right:0}
.strip .cs{font-family:var(--f-mono);font-weight:600;font-size:13px}
.strip .route{font-family:var(--f-mono);font-size:17px;font-weight:600;letter-spacing:.02em}
.strip .route .arr{opacity:.5;margin:0 4px}
.strip .ttl{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2;margin-top:2px}
.strip .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.strip .pay{font-family:var(--f-mono);font-size:17px;font-weight:600}
.strip .side{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:8px;text-align:right}
.strip .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
@media (max-width:720px){
  .strip{grid-template-columns:minmax(0,1fr) auto}
  .strip > div{border-right:0}
  .strip .c-id{grid-column:1/-1;border-bottom:1px dashed color-mix(in srgb,var(--ink) 22%,transparent);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding-block:7px}
  .strip .c-main{grid-column:1/-1}
  .strip .c-cond{grid-column:1/2;padding-top:0}
  .strip .c-side{grid-column:2/3;padding-top:0}
}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.metar{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:nowrap}

.brief{font-size:16px;line-height:1.62;max-width:68ch}
.brief p + p{margin-top:12px}
.brief.ai{border-left:3px solid var(--sea);padding-left:14px}
.hero-brief{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.hero-brief .route-big{font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:.02em}
.hero-brief h1{font-size:clamp(26px,4vw,38px);font-weight:800}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.cell h4{font-size:15px;margin-bottom:6px}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li + li{margin-top:5px}
.teach{background:var(--sky-soft);border-radius:10px;padding:14px 16px}
.teach h3{font-size:15px;color:var(--sky);margin-bottom:4px}
.sealed{background:repeating-linear-gradient(135deg,var(--coral-soft) 0 12px,transparent 12px 24px),var(--surface);border:1.5px dashed var(--coral);border-radius:10px;padding:16px}
.sealed h3{color:var(--coral)}
.opened{background:var(--coral-soft);border:1.5px solid var(--coral);border-radius:10px;padding:16px}

.meter{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.meter > i{display:block;height:100%;background:var(--sea);border-radius:999px}
.meter.warn > i{background:var(--warn)}
.meter.bad > i{background:var(--bad)}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
textarea{min-height:120px;font-family:var(--f-mono);font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.opt-group{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px;cursor:pointer}
.opt input:checked + span{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .opt input:checked + span{color:#04201d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt input:checked + span{color:#04201d}}
.opt input:focus-visible + span{outline:2px solid var(--coral);outline-offset:2px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--sea);flex:none}

.grade{font-family:var(--f-display);font-weight:800;font-size:76px;line-height:.9}
.grade.A{color:var(--good)}.grade.B{color:var(--sea)}.grade.C{color:var(--warn)}.grade.D,.grade.F{color:var(--bad)}

.ladder{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rung .badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px;border:2px solid var(--line);color:var(--muted)}
.rung.earned .badge{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .rung.earned .badge{color:#04201d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rung.earned .badge{color:#04201d}}
.rung.ready .badge{border-color:var(--coral);color:var(--coral)}
@media (max-width:560px){.rung{grid-template-columns:40px minmax(0,1fr)}.rung > :last-child{grid-column:1/-1}}

.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.person .who{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none}
.journal{display:flex;flex-direction:column;gap:0}
.entry{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.entry h4{font-size:16px;margin-bottom:4px}
@media (max-width:560px){.entry{grid-template-columns:minmax(0,1fr);gap:4px}}

.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.setup{max-width:640px;margin:6vh auto 0}
.setup h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.03em}
.horizon{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--sea),var(--sky) 55%,var(--coral));margin:14px 0 18px;max-width:220px}
details summary{cursor:pointer;font-weight:600}
.spark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ai-out{white-space:pre-wrap}

.dispatch{background:linear-gradient(180deg,var(--sea-soft),var(--surface) 70%)}
.msgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
.msg{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.msg .avatar{width:32px;height:32px;font-size:12px}
.tip{margin-top:10px;color:var(--muted)}
.stars{font-size:20px;letter-spacing:2px;line-height:1}
.stars .on{color:#e0a400}.stars .off{color:var(--line)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;opacity:.6}
.ach.on{opacity:1;border-style:solid;border-color:color-mix(in srgb,#e0a400 55%,var(--line));background:color-mix(in srgb,#e0a400 8%,var(--surface))}
.medal{border:1px solid color-mix(in srgb,#e0a400 55%,var(--line));background:color-mix(in srgb,#e0a400 10%,var(--surface));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.chart{width:100%;height:auto}
.chart .cg{stroke:var(--line);stroke-dasharray:3 4}.chart .ct{fill:var(--muted);font:11px var(--f-mono)}
.chart .cl{fill:none;stroke:var(--sea);stroke-width:2}
.chart .cd{stroke:var(--surface);stroke-width:1.5}.chart .gA{fill:var(--good)}.chart .gB{fill:var(--sea)}.chart .gC{fill:var(--warn)}.chart .gD,.chart .gF{fill:var(--bad)}
.mapwrap{overflow:hidden;border-radius:8px;background:var(--sea-soft)}
.map{display:block;width:100%;height:auto}
.map .mg{stroke:var(--line);stroke-width:1;opacity:.7}
.map .ml{fill:var(--muted);font:11px var(--f-mono)}
.map .ap{cursor:pointer}
.map .ap circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.map .ap.visited circle{fill:var(--sea);stroke:var(--surface)}
.map .ap.water circle{fill:none;stroke:var(--sky);stroke-width:2;stroke-dasharray:3 2}
.map .ap.locked{opacity:.3}
.map .ap.job circle{stroke:var(--coral);stroke-width:2.5}
.map .ap.here circle{fill:var(--coral);stroke:var(--surface);stroke-width:2.5}
.map .ap.sel circle{stroke:var(--coral);stroke-width:3.5}
.map .ap:focus{outline:none}.map .ap:focus-visible circle{stroke:var(--coral);stroke-width:4}
.map .al{fill:var(--ink);font:600 12px var(--f-mono);paint-order:stroke;stroke:var(--sea-soft);stroke-width:3px}
.map .route{stroke:var(--coral);stroke-width:1.6;stroke-dasharray:6 5;opacity:.7}
.map .route.co{stroke:var(--sky)}
.map .route.active{stroke-width:3;stroke-dasharray:none;opacity:1}
.map .storm circle{fill:var(--bad);fill-opacity:.12;stroke:var(--bad);stroke-dasharray:6 6}
.map .stl{fill:var(--bad);font:700 14px var(--f-body)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);vertical-align:-1px;margin-right:4px}
.lg.here{background:var(--coral);border-color:var(--coral)}.lg.visited{background:var(--sea);border-color:var(--sea)}.lg.locked{opacity:.35}.lg.water{border:2px dashed var(--sky);background:none}
.lr{display:inline-block;width:18px;border-top:2px dashed var(--coral);vertical-align:3px;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.map .ap.here circle{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{stroke-width:6;stroke-opacity:.5}}}
.surprise{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--violet) 10%,transparent) 0 12px,transparent 12px 24px),var(--surface);border:1.5px dashed var(--violet);border-radius:10px;padding:16px}
.surprise.open{background:color-mix(in srgb,var(--violet) 10%,var(--surface));border-style:solid}
.surprise h3{color:var(--violet)}
.twist{border:1.5px solid var(--coral);background:linear-gradient(180deg,var(--coral-soft),var(--surface) 80%)}
.twist h3{font-size:22px}
.celeb-card{border:1.5px solid color-mix(in srgb,#e0a400 60%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,#e0a400 12%,var(--surface)),var(--surface) 80%)}
.person.unknown{opacity:.65;border-style:dashed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

:root{--side:#08171c;--side-2:#0e242a;--side-ink:#e6f0ef;--side-mut:#8fa8a7;--line:#d6e2e1;--bg:#eef3f2;--r:16px;
  --shadow:0 1px 2px rgba(13,31,36,.05),0 6px 20px rgba(13,31,36,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side:#050f12;--side-2:#0b1c20;--line:#1f3539;--bg:#071417}}
:root[data-theme="dark"]{--side:#050f12;--side-2:#0b1c20;--line:#1f3539;--bg:#071417}
body{font-size:15px}
#app:has(> .side){display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
#app > .side{grid-row:1/span 2;grid-column:1}
#app > .topbar{grid-column:2;grid-row:1}
#app:has(> .side) > main{grid-column:2;grid-row:2;width:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;background:radial-gradient(120% 40% at 0% 0%,rgba(67,184,173,.16),transparent 60%),radial-gradient(90% 30% at 100% 100%,rgba(217,83,47,.14),transparent 60%),var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;border-right:1px solid rgba(255,255,255,.06)}
.side .logo{width:34px;height:34px;color:#fff;flex:none}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.side-brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;display:block;line-height:1}
.side-brand span{font-size:11px;color:var(--side-mut);letter-spacing:.04em}
.side-pilot{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}
.pav{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#0b746f,#d9532f)}
.side-pilot b{display:block;font-size:15px}
.side-pilot span{display:block;font-size:12px;color:var(--side-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-pilot small{display:block;font-size:11px;color:var(--side-mut);margin-top:4px}
.xp{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#43b8ad,#ffb36b);border-radius:3px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-g{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--side-mut);opacity:.75;padding:12px 10px 5px}
.snav{appearance:none;border:0;background:none;color:#b6cac9;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;position:relative;transition:background-color .15s,color .15s}
.snav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.snav .lbl{flex:1}
.snav:hover{background:rgba(255,255,255,.06);color:#fff}
.snav[aria-current="page"]{background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:#fff}
.snav[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--coral)}
.snav[aria-current="page"] svg{color:#ff9470;opacity:1}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--side-mut);padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.07)}
.side-foot .sep{opacity:.5}
.simdot{width:8px;height:8px;border-radius:50%;background:#5d7271}.simdot.on{background:#2fd39a;box-shadow:0 0 0 3px rgba(47,211,154,.2)}
.topbar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.tb-in{max-width:1180px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
.tb-title h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tb-title p{font-size:13px;color:var(--muted)}
.tb-brand{display:none}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hp{appearance:none;font:inherit;color:inherit;display:flex;flex-direction:column;line-height:1.15;padding:6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hp small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hp b{font-size:14px;font-weight:600;white-space:nowrap}
.hp.cash b{color:var(--good)}
.hp.go{cursor:pointer;background:var(--coral);border-color:var(--coral);color:#fff}.hp.go small{color:rgba(255,255,255,.8)}
.mrail{display:none}
@media (max-width:1000px){
  #app:has(> .side){display:block}
  .side{display:none}
  .topbar{background:var(--side);color:var(--side-ink);border-bottom:0;backdrop-filter:none}
  .tb-in{padding-block:10px 8px}
  .tb-brand{display:flex;align-items:center;gap:8px}.tb-brand .logo{width:24px;height:24px;color:#fff}.tb-brand b{font-family:var(--f-display);font-weight:800;font-size:18px}
  .tb-title h1,.tb-title p{display:none}
  .hp{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);box-shadow:none;padding:4px 9px}
  .hp small{color:var(--side-mut)}.hp.cash b{color:#5fe0a6}
  .hide-s{display:none}
  .mrail{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px max(10px,env(safe-area-inset-left,0px)) 8px;border-top:1px solid rgba(255,255,255,.08)}
  .mrail::-webkit-scrollbar{display:none}
  .mrail .tab{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;border:0;background:none;color:#a9bfbe;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
  .mrail .tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mrail .tab[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff}
  .mrail .tab[aria-current="page"]::after{display:none}
}
/* =================== DESIGN SYSTEM v2: components =================== */
main{padding-block:24px 72px}
.panel{border-radius:var(--r);padding:20px;border-color:var(--line)}
.panel h2{font-size:20px;letter-spacing:-.015em}
.section-title{margin-bottom:12px}
.section-title h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.btn{border-radius:10px;font-weight:650}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--sea) 88%,#fff),var(--sea));box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 6px color-mix(in srgb,var(--sea) 30%,transparent)}
.btn.action{background:linear-gradient(180deg,color-mix(in srgb,var(--coral) 88%,#fff),var(--coral));box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 6px color-mix(in srgb,var(--coral) 30%,transparent)}
.btn:active{transform:translateY(1px)}
.chip{font-weight:650;letter-spacing:.005em}
.notice{border-radius:12px}
.meter{border:0;background:color-mix(in srgb,var(--line) 70%,transparent)}
.meter > i{background:linear-gradient(90deg,var(--sea),color-mix(in srgb,var(--sea) 60%,#7fe3d6))}
.jcard,.arc-card,.arc-row,.person,.cell{border-radius:var(--r)}
.campaign{border-top:0;position:relative;overflow:hidden}
.campaign::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--sea),var(--coral))}
table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* live cabin feed */
.cabin-host{border-left:4px solid var(--sea)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:9px 11px;border-radius:12px;background:var(--surface-2);font-size:14px}
.feed li:first-child{background:var(--sea-soft);animation:fade .3s ease-out}
.feed .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sea)}
.feed time{font-size:11px;color:var(--muted)}
.jc-foot{flex-wrap:nowrap}.jc-wx{flex:1;overflow:hidden}.jc-wx > span:not(.mono){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jc-go{flex:none}

/* coach */
.feed li.coach{background:color-mix(in srgb,var(--sky) 12%,var(--surface));border-left:3px solid var(--sky)}
.feed li.coach .who{color:var(--sky)}
.feed li.crit{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-left:3px solid var(--coral)}
.feed li.crit .who{color:var(--coral)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,var(--coral),#b8352a);color:#fff;box-shadow:0 10px 30px color-mix(in srgb,var(--coral) 35%,transparent);animation:fade .25s ease-out}
.callout .who{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:999px;flex:none}
.callout p{font-size:17px;font-weight:600;line-height:1.35}

.livewx{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:var(--sky-soft);font-size:12.5px}
.call-card{max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.ring-ph .avatar{width:72px;height:72px;font-size:24px;border-radius:50%;box-shadow:0 0 0 0 rgba(217,83,47,.5)}
@media (prefers-reduced-motion:no-preference){.ring-ph .avatar{animation:ringing 1.4s ease-out infinite}@keyframes ringing{0%{box-shadow:0 0 0 0 rgba(217,83,47,.55)}100%{box-shadow:0 0 0 22px rgba(217,83,47,0)}}}
.call-job{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;padding:10px 14px;border-radius:12px;background:var(--surface-2);width:100%;font-size:14px}
.choice{border:2px solid var(--coral);background:linear-gradient(180deg,var(--coral-soft),var(--surface))}
.choice-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice-btns .btn{justify-content:center;padding:12px;white-space:normal}
@media (max-width:520px){.choice-btns{grid-template-columns:1fr}}

.weekly{border-top:4px solid #c98a1a}
.wk{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.wk.done{background:color-mix(in srgb,var(--good) 12%,var(--surface))}.wk.done b{color:var(--good)}
.wk .meter > i{background:linear-gradient(90deg,#c98a1a,#f2b14a)}
.season{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000))}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.rec{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.rec b{font-size:24px}

.theme-btn{appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--side-mut);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-top:auto}
.theme-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.theme-btn + .side-foot{margin-top:0}
.import-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.voice-btn{margin-left:auto;margin-right:8px;padding:4px 10px;font-size:12px}

/* layout fit */
#app:has(> .side) > main.wrap{max-width:1440px}
.tb-in{max-width:1440px}
@media (min-width:1500px){.grid-2{grid-template-columns:minmax(0,1fr) 380px}}
/* difficulty switch */
.diff{display:inline-flex;align-items:center;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.diff button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;cursor:pointer}
.diff button.on{background:var(--ink);color:var(--bg)}
.diff button:not(.on):hover{color:var(--ink)}
@media (max-width:1000px){.diff{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);box-shadow:none}.diff button{color:var(--side-mut);padding:5px 8px}.diff button.on{background:#fff;color:#08171c}}
/* desktop app: no title bar, drag by the top bar */
html.tw-app .topbar,html.tw-app .side-brand{-webkit-app-region:drag}
html.tw-app .topbar button,html.tw-app .topbar a,html.tw-app .topbar .hp,html.tw-app .mrail{-webkit-app-region:no-drag}
html.tw-app .tb-in{padding-right:150px}
html.tw-app .side{padding-top:14px}

.urgent-host{max-width:1440px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.urgent{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#d9532f,#a3271b);box-shadow:0 8px 24px rgba(217,83,47,.35)}
.urgent > div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:220px}
.urgent b{letter-spacing:.04em}.urgent .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.urgent .btn.action{background:#fff;color:#a3271b;border-color:#fff}
.urgent.late{background:linear-gradient(135deg,#5d6b6e,#3a4547)}
.big-count{font-size:26px;font-weight:700}
.urg-pulse{width:14px;height:14px;border-radius:50%;background:#fff;flex:none}
@media (prefers-reduced-motion:no-preference){.urg-pulse{animation:urgp 1s ease-in-out infinite}@keyframes urgp{50%{opacity:.25;transform:scale(.7)}}}
html.tw-app .urgent-host{-webkit-app-region:no-drag}

/* art */
.art{display:block;width:100%;height:100%}
.jc-art{margin:-16px -16px 2px;height:92px;overflow:hidden;position:relative}
.jc-art::after{content:"";position:absolute;inset:auto 0 0;height:30px;background:linear-gradient(transparent,var(--surface))}
.jcard::before{z-index:2}
.pass{position:relative}
.pass-art{position:absolute;inset:0 auto auto 0;width:100%;height:110px;opacity:.9;pointer-events:none;z-index:0;border-radius:inherit;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.pass > *:not(.pass-art){position:relative;z-index:1}
.hg-sil{height:34px;color:var(--sea);opacity:.85}.hg-sil .sil{height:34px;width:auto}
/* academy */
.ac-hero{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:26px;border-radius:16px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,rgba(255,180,107,.35),transparent 50%),linear-gradient(135deg,#0b3d52,#0b746f);box-shadow:var(--shadow)}
.ac-hero h1{font-size:clamp(24px,3.4vw,34px);margin:4px 0 8px}.ac-hero p{max-width:640px;opacity:.92}
.ac-prog{min-width:200px;display:flex;flex-direction:column;gap:6px}.ac-prog b{font-family:var(--f-display);font-size:34px}.ac-prog .meter{background:rgba(255,255,255,.2)}.ac-prog .meter > i{background:#fff}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ac-card{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ac-card h3{font-size:16px;margin:2px 0 4px}
.ac-card.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ac-card.cur{border:2px solid var(--coral)}
.ac-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--surface-2)}
.lesson{border-top:4px solid var(--coral)}
.ac-setup{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--sky-soft);font-size:14px}
.ac-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ac-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;background:var(--surface-2);opacity:.7}
.ac-steps li.now{opacity:1;background:color-mix(in srgb,var(--coral) 10%,var(--surface));box-shadow:inset 0 0 0 2px var(--coral)}
.ac-steps li.done{opacity:1}.ac-steps li.done p{color:var(--muted)}
.ac-steps .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:2px solid var(--line)}
.ac-steps li.done .n{background:var(--good);border-color:var(--good);color:#fff}.ac-steps li.now .n{border-color:var(--coral);color:var(--coral)}
.grid-tips{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:700px){.grid-tips{grid-template-columns:1fr}}
.ac-real{padding:12px 14px;border-radius:12px;background:var(--sand)}
.side{gap:12px;padding-top:16px}.side-g{padding:8px 10px 3px}.snav{padding:7px 10px;font-size:14px}.side-pilot{padding:10px}
.pass-art{opacity:.38;height:120px}

/* live map + replay */
.flown{fill:none;stroke:var(--coral);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 7}
.liveplane path{fill:#fff;stroke:#0b1d24;stroke-width:1.5}.liveplane .halo{fill:color-mix(in srgb,var(--coral) 35%,transparent)}
@media (prefers-reduced-motion:no-preference){.liveplane .halo{animation:halo 1.6s ease-out infinite;transform-origin:center}@keyframes halo{0%{r:10;opacity:1}100%{r:26;opacity:0}}}
.livebox{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px}
.dot-live{width:10px;height:10px;border-radius:50%;background:#2fd39a;box-shadow:0 0 0 4px rgba(47,211,154,.25)}
.replay-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:800px){.replay-grid{grid-template-columns:1fr}}
.replay-map,.replay-ap{width:100%;height:auto;background:var(--surface-2);border-radius:12px}
.r-start{fill:#2fbf8f;stroke:#fff;stroke-width:2}.r-end{fill:var(--coral);stroke:#fff;stroke-width:2}
.replay-ap .ax{stroke:var(--line);stroke-width:2}.replay-ap .axl{font-size:12px;fill:var(--muted)}
.replay-ap .apl{fill:none;stroke:var(--sky);stroke-width:3}.replay-ap circle.ok{fill:var(--good)}.replay-ap circle.warn{fill:var(--warn)}.replay-ap circle.bad{fill:var(--bad)}
.realnow{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--sand)}

/* in-flight screen */
.if-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:20px 22px;border-radius:16px;color:#fff;background:radial-gradient(100% 140% at 100% 0%,rgba(255,148,112,.3),transparent 55%),linear-gradient(135deg,#08171c,#0e3a40)}
.if-head h1{font-size:clamp(22px,3vw,30px);margin-top:4px}.if-head .label{color:rgba(255,255,255,.7)}
.if-head .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.if-timer{font-size:20px;font-weight:600;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.1)}
.if-phase{display:flex;gap:12px;align-items:center}.if-phase b{display:block;font-family:var(--f-display);font-size:20px}.if-phase span{color:var(--muted);font-size:14px}
.if-ph-dot{width:14px;height:14px;border-radius:50%;background:var(--sea);flex:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--sea) 25%,transparent)}
.if-ph-dot.final,.if-ph-dot.descent{background:var(--coral);box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}.if-ph-dot.manual{background:var(--muted)}
.if-route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}.if-route b{font-size:20px}
.if-bar{position:relative;height:8px;border-radius:4px;background:var(--line)}.if-bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sea),var(--coral))}
.if-plane{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(90deg);color:var(--ink)}.if-plane svg{width:22px;height:22px;fill:currentColor}
.if-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.if-tile{display:flex;flex-direction:column;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}

/* manifest */
.mf-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}

.wiz{max-width:620px}.wiz-art{height:150px;border-radius:14px;overflow:hidden;margin-top:6px}

.wiz-status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface-2)}.wiz-status.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
/* profile */
.pf-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:24px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#08171c,#0e3a40 60%,#d9732f)}.pf-hero h1{font-size:clamp(26px,4vw,40px)}.pf-hero .btn{margin-left:auto}
.pav.big{width:76px;height:76px;font-size:28px;border-radius:20px}
.pf-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pf-tile{display:flex;flex-direction:column;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.pf-tile span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.pf-tile b{font-size:24px}.pf-tile small{color:var(--muted);font-size:11px}
.pf-map{width:100%;height:auto;background:color-mix(in srgb,var(--sky) 10%,var(--surface-2));border-radius:12px}.pf-map circle{fill:var(--line)}.pf-map circle.v{fill:var(--coral);stroke:#fff;stroke-width:1.5}
.pf-bar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13px}.pf-bar > div{height:10px;border-radius:5px;background:var(--surface-2)}.pf-bar i{display:block;height:100%;border-radius:5px;background:var(--sea)}.pf-bar i.l-butter{background:#2fbf8f}.pf-bar i.l-firm{background:var(--warn)}.pf-bar i.l-hard{background:var(--bad)}
/* big display */

.big-top{display:flex;justify-content:space-between;font-size:2.4vh;color:#8fb0ad}.big-ph{color:#ff9470;font-weight:700}

.bt{display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:2vh;background:#0b1d20;border:1px solid #1d3539}.bt span{font-size:2.2vh;letter-spacing:.2em;color:#8fb0ad}.bt b{font-family:var(--f-mono);font-size:9vh;line-height:1.05}.bt small{font-size:2vh;color:#8fb0ad}.bt.warn b{color:#ff7a55}

.big-hint,.big-empty{text-align:center;color:#5d7b78;font-size:1.8vh}.big-empty{grid-column:1/-1;font-size:3vh}

/* butter cup */
