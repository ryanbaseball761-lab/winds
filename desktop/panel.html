<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Trade Winds</title>
<style>
html,body{margin:0;padding:0;background:#08171c;color:#e2eeed;font-family:"Segoe UI",Arial,sans-serif;font-size:14px}
#app{padding:10px 12px 16px}
.lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#93aaa9;font-weight:bold}
h1{font-size:17px;margin:2px 0 2px}
.route{font-family:Consolas,monospace;font-size:20px;font-weight:bold;color:#fff}
.route b{color:#ff9470;padding:0 6px}
.phase{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:10px;background:#12454f;font-size:12px;font-weight:bold}
.strip{display:table;width:100%;margin:10px 0 6px;border-collapse:separate;border-spacing:4px 0}
.strip div{display:table-cell;background:#0f2327;border-radius:8px;padding:6px 6px;text-align:center}
.strip span{display:block;font-size:10px;color:#93aaa9;text-transform:uppercase}
.strip b{font-family:Consolas,monospace;font-size:16px}
.box{background:#0f2327;border-radius:10px;padding:9px 10px;margin-top:8px}
.orders{background:#3a2208;border:1px solid #e8782a}
.orders .lbl{color:#ffb27a}
.call{background:#12454f;border-left:4px solid #f2b33d}
.ck{list-style:none;margin:6px 0 0;padding:0}
.ck li{padding:7px 8px;margin:3px 0;border-radius:7px;background:#0b1d20;cursor:pointer}
.ck li.done{color:#6f8a89;text-decoration:line-through;background:#0a1719}
.ck li .tick{display:inline-block;width:16px;color:#43d17f;font-weight:bold}
.tabs{margin-top:6px}
.tabs span{display:inline-block;padding:3px 7px;margin:2px 2px 0 0;border-radius:8px;font-size:11px;background:#0b1d20;color:#93aaa9;cursor:pointer}
.tabs span.on{background:#1f9d55;color:#fff}.tabs span.all{color:#43d17f}
.feed p{margin:4px 0;font-size:13px}.feed b{color:#ffb27a}
.meter{height:6px;background:#22393c;border-radius:4px;margin-top:4px;overflow:hidden}.meter i{display:block;height:100%;background:#43d17f}
.idle{color:#93aaa9;text-align:center;padding:30px 10px}
</style></head>
<body><div id="app"><div class="idle">Connecting to the Trade Winds app…</div></div>
<script>
var view = null, lastJson = '';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function get(url, cb){ var x=new XMLHttpRequest(); x.onreadystatechange=function(){ if(x.readyState===4){ if(x.status===200){ try{ cb(JSON.parse(x.responseText||'{}')); }catch(e){ cb(null); } } else cb(null); } }; x.open('GET', url, true); x.send(); }
function post(url, body){ var x=new XMLHttpRequest(); x.open('POST', url, true); x.setRequestHeader('Content-Type','text/plain'); x.send(JSON.stringify(body)); }
function render(s){
  var el=document.getElementById('app');
  if(!s){ el.innerHTML='<div class="idle">Trade Winds isn\'t running.<br>Start the app on this PC.</div>'; return; }
  if(!s.job){ el.innerHTML='<div class="idle"><div class="lbl">Trade Winds</div><h1>No flight booked</h1>'+(s.next?'<p>Next up: '+esc(s.next)+'</p>':'')+'<p>Pick a job in the app, then come back here.</p></div>'; return; }
  var h='';
  h+='<div class="lbl">'+esc(s.job.ac)+'</div><h1>'+esc(s.job.title)+'</h1><div class="route">'+esc(s.job.from)+'<b>&#8594;</b>'+esc(s.job.to)+'</div>';
  if(s.phase) h+='<span class="phase">'+esc(s.phase)+'</span>';
  if(s.live){ h+='<div class="strip"><div><span>IAS</span><b>'+s.live.ias+'</b></div><div><span>ALT</span><b>'+s.live.alt+'</b></div><div><span>V/S</span><b>'+s.live.vs+'</b></div><div><span>To go</span><b>'+s.live.togo+'</b></div></div>'; }
  if(s.orders){ h+='<div class="box orders"><div class="lbl">Sealed orders</div><b>'+esc(s.orders.title)+'</b><p style="margin:4px 0 0">'+esc(s.orders.text)+'</p>'+(s.orders.sim?'<p style="margin:4px 0 0;color:#ffb27a">'+esc(s.orders.sim)+'</p>':'')+'</div>'; }
  if(s.callout){ h+='<div class="box call"><div class="lbl">'+esc(s.callout.who||'Coach')+'</div>'+esc(s.callout.text)+'</div>'; }
  if(s.phases && s.phases.length){ if(view===null) view=s.cur||0; var p=s.phases[view]||s.phases[0];
    h+='<div class="box"><div class="lbl">Checklist</div><div class="tabs">'; for(var i=0;i<s.phases.length;i++){ h+='<span data-p="'+i+'" class="'+(i===view?'on':'')+(s.phases[i].all?' all':'')+'">'+esc(s.phases[i].n)+'</span>'; } h+='</div><ul class="ck">';
    for(var j=0;j<p.items.length;j++){ h+='<li data-k="'+view+'-'+j+'" class="'+(p.done[j]?'done':'')+'"><span class="tick">'+(p.done[j]?'&#10003;':'&#9675;')+'</span>'+esc(p.items[j])+'</li>'; } h+='</ul></div>'; }
  if(s.comfort!=null){ h+='<div class="box"><div class="lbl">Cabin comfort '+s.comfort+'/100</div><div class="meter"><i style="width:'+s.comfort+'%"></i></div></div>'; }
  if(s.feed && s.feed.length){ h+='<div class="box feed"><div class="lbl">Cabin &amp; radio</div>'; for(var k=0;k<Math.min(4,s.feed.length);k++){ h+='<p><b>'+esc(s.feed[k].who)+'</b> '+esc(s.feed[k].text)+'</p>'; } h+='</div>'; }
  el.innerHTML=h;
}
document.addEventListener('click', function(e){ var t=e.target; while(t && t!==document && !(t.getAttribute && (t.getAttribute('data-k')||t.getAttribute('data-p')))) t=t.parentNode; if(!t||t===document) return;
  if(t.getAttribute('data-p')!=null){ view=Number(t.getAttribute('data-p')); lastJson=''; tick(); return; }
  post('/ck', {k:t.getAttribute('data-k')}); t.className = t.className.indexOf('done')>=0 ? '' : 'done'; });
function tick(){ get('/state?t='+Date.now(), function(s){ var j=JSON.stringify(s); if(j!==lastJson){ lastJson=j; render(s); } }); }
tick(); setInterval(tick, 1500);
</script></body></html>
