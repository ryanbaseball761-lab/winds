name: Desktop installer
# Builds the Windows installer when a tag like desktop-v0.20.0 is pushed (or by hand from the Actions tab).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Installer version for the release tag (desktop-v<version>), e.g. 0.85.0
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: TradeWinds-installer
          path: desktop/dist/*.exe
      # a tag push also publishes the installer as a public beta release (Releases page), so testers can download it
      - name: Publish the beta release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Trade Winds beta ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: docs/launch/release-notes.md
          files: desktop/dist/*.exe
