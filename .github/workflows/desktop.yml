name: Desktop installer
# Builds the Windows installer when a tag like desktop-v0.20.0 is pushed (or by hand from the Actions tab).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: TradeWinds-installer
          path: desktop/dist/*.exe
      # a tag push also publishes the installer as a public beta release (Releases page), so testers can download it
      - name: Publish the beta release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Trade Winds beta ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: docs/launch/release-notes.md
          files: desktop/dist/*.exe
